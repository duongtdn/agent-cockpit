<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jobs console</title>
    <link rel="stylesheet" href="/modules/xterm/xterm.css" />
    <link rel="stylesheet" href="/page.css" />
    <!--
      The browser loads the package's modules as they are built: the import
      map gives each bare name the path the app serves it at. No bundler.
    -->
    <script type="importmap">
      {
        "imports": {
          "@duongtdn/agent-cockpit/client": "/modules/agent-cockpit/client/index.js",
          "@duongtdn/agent-cockpit/terminal": "/modules/agent-cockpit/terminal/index.js",
          "@xterm/xterm": "/modules/xterm/xterm.mjs",
          "@xterm/addon-fit": "/modules/addon-fit/addon-fit.mjs"
        }
      }
    </script>
    <script type="module" src="/page.js"></script>
  </head>
  <body>
    <header>
      <h1>Jobs console</h1>
      <p id="connection" role="status">Connecting…</p>
    </header>
    <main>
      <section aria-labelledby="jobs-heading">
        <h2 id="jobs-heading">Jobs</h2>
        <div id="launchers" class="launchers">Reading the jobs…</div>
      </section>
      <section aria-labelledby="sessions-heading">
        <h2 id="sessions-heading">Sessions</h2>
        <p id="no-sessions" hidden>No sessions yet: run a job.</p>
        <ul id="sessions" class="sessions"></ul>
      </section>
      <section id="terminal-section" aria-labelledby="terminal-heading" hidden>
        <h2 id="terminal-heading">
          Terminal of <span id="terminal-key"></span>
          <small id="terminal-status"></small>
        </h2>
        <div id="terminal"></div>
      </section>
    </main>
  </body>
</html>
