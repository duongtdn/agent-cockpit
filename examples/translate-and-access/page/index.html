<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Translate and access</title>
    <link rel="stylesheet" href="/modules/xterm/xterm.css" />
    <link rel="stylesheet" href="/page.css" />
    <!--
      The browser loads the package's modules as they are built: the import
      map gives each bare name the path the app serves it at. No bundler.
    -->
    <script type="importmap">
      {
        "imports": {
          "@duongtdn/agent-cockpit/client": "/modules/agent-cockpit/client/index.js",
          "@duongtdn/agent-cockpit/terminal": "/modules/agent-cockpit/terminal/index.js",
          "@xterm/xterm": "/modules/xterm/xterm.mjs",
          "@xterm/addon-fit": "/modules/addon-fit/addon-fit.mjs"
        }
      }
    </script>
    <script type="module" src="/page.js"></script>
  </head>
  <body>
    <header>
      <h1>Translate and access</h1>
      <p id="connection" role="status">Connecting…</p>
    </header>
    <main>
      <section aria-labelledby="access-heading">
        <h2 id="access-heading">Access</h2>
        <p id="whoami" role="status">Asking the app’s API who this page is…</p>
        <p class="actions">
          <button type="button" id="without-token">Call the API without the token</button>
          <button type="button" id="renew">Renew the token</button>
        </p>
        <p id="access-result" role="status"></p>
        <form id="sign-in" hidden>
          <p>
            This page comes from the network. If the app was started with
            <code>--open</code>, sign in with the password it printed.
          </p>
          <label>Password <input name="password" type="password" required autocomplete="off" /></label>
          <button type="submit">Sign in</button>
        </form>
      </section>
      <section aria-labelledby="sessions-heading">
        <h2 id="sessions-heading">Sessions</h2>
        <form id="run-form">
          <label>Name <input name="name" required placeholder="Ada" autocomplete="off" /></label>
          <button type="submit">Say hello</button>
        </form>
        <p id="run-result" role="status"></p>
        <p id="no-sessions" hidden>No sessions yet: say hello to someone.</p>
        <table id="sessions" hidden>
          <thead>
            <tr>
              <th scope="col">Session</th>
              <th scope="col">State</th>
              <th scope="col">Last answer</th>
              <th scope="col"><span class="visually-hidden">Terminal</span></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
      <section id="terminal-section" aria-labelledby="terminal-heading" hidden>
        <h2 id="terminal-heading">
          Terminal of <span id="terminal-key"></span>
          <small id="terminal-status"></small>
        </h2>
        <p id="terminal-error" role="status"></p>
        <div id="terminal"></div>
      </section>
    </main>
  </body>
</html>
