name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      # node-pty ships no prebuilt binary for Linux: its install script compiles it.
      - name: Install tmux and what node-pty compiles with
        run: sudo apt-get update && sudo apt-get install --yes tmux build-essential python3
      - name: Check that tmux is 3.2a or later
        run: |
          version="$(tmux -V | cut -d ' ' -f 2)"
          echo "tmux $version"
          test "$(printf '%s\n' 3.2a "$version" | sort --version-sort | head -n 1)" = 3.2a
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      # The terminal's browser tests run in Playwright's Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      # The pinned agent, in tmux, against a scripted API of the suite's own: no login, no secret.
      - run: pnpm test:contract
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contract-results-node-${{ matrix.node }}
          path: test-results/contract.json
      - run: pnpm build
      - run: pnpm test:pack
