name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      # node-pty ships no prebuilt binary for Linux: its install script compiles it. The agent's
      # sandbox, which the contract rows of the confinement lines turn on, runs on bubblewrap and socat.
      - name: Install tmux, what node-pty compiles with, and the agent's sandbox
        run: sudo apt-get update && sudo apt-get install --yes tmux build-essential python3 bubblewrap socat
      # Ubuntu 24.04 restricts user namespaces through AppArmor twice: an unconfined process may not
      # make one (the sysctl), and its bwrap-userns-restrict profile, where loaded, lets bwrap make
      # one but denies every capability to what bwrap runs. The agent's seccomp helper, run inside
      # bwrap, makes a user namespace of its own and needs its capabilities there (to write
      # /proc/self/setgroups), so that profile is unloaded. The check makes the same nesting, and
      # fails the job here, loudly, if the runner still cannot.
      - name: Let the agent's sandbox make user namespaces, nested ones too
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap_profiles() { sudo aa-status 2> /dev/null | grep -i bwrap || echo "  none"; }
          echo "AppArmor profiles about bwrap:"; bwrap_profiles
          if [ -e /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser --remove /etc/apparmor.d/bwrap-userns-restrict || true
          fi
          echo "Still loaded:"; bwrap_profiles
          bwrap --unshare-all --die-with-parent --ro-bind / / --proc /proc --dev /dev \
            unshare --user --map-root-user true
          echo "bwrap makes its namespaces, and what it runs makes its own"
      - name: Check that tmux is 3.2a or later
        run: |
          version="$(tmux -V | cut -d ' ' -f 2)"
          echo "tmux $version"
          test "$(printf '%s\n' 3.2a "$version" | sort --version-sort | head -n 1)" = 3.2a
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      # The terminal's browser tests run in Playwright's Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      # The pinned agent, in tmux, against a scripted API of the suite's own: no login, no secret.
      # Its sandbox rows fail, saying why, where the sandbox cannot run: the step above makes it run.
      - name: Diagnose the dialog keys on this tmux (temporary)
        run: |
          for run in 1 2 3; do
            mkdir -p /tmp/cockpit-diagnostics
            echo "#### run $run $(date +%s%3N)" | tee -a /tmp/cockpit-diagnostics/presses.log >> /tmp/cockpit-diagnostics/screens.log
            pnpm test:contract 2>&1 | grep -E '×|FAIL|Error|Tests ' || true
          done
      - run: pnpm test:contract
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contract-results-node-${{ matrix.node }}
          path: test-results/contract.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cockpit-diagnostics-node-${{ matrix.node }}
          path: /tmp/cockpit-diagnostics
      - run: pnpm build
      - run: pnpm test:pack
      # A browser through the apps of examples/, on the built package, against the scripted API.
      - run: pnpm test:e2e
